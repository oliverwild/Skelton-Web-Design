<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gallery — Studio Skelton</title>
    <meta name="description" content="Selected work by Studio Skelton — London based hospitality and residential interior design." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lato:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Studio Skelton" />
    <meta property="og:image" content="https://oliverwild.github.io/Skelton-Web-Design/images/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:title" content="Gallery — Studio Skelton" />
    <link rel="stylesheet" href="style.css?v=7" />
</head>

<body class="gallery">
    <a class="gallery-home" href="index.html">
        <img src="images/logo.png" alt="Studio Skelton — home" />
    </a>

    <main class="gallery-feed">
        <!-- Replace each .gallery-placeholder with:
             <img src="images/gallery/your-photo.jpg" alt="Project name" loading="lazy" />
             Use images at least 2400px wide for full-bleed sharpness. -->
        <div class="gallery-item">
            <div class="gallery-placeholder">
                <img src="images/symbol.png" alt="" />
                <span>Image One</span>
            </div>
        </div>
        <div class="gallery-item">
            <div class="gallery-placeholder">
                <img src="images/symbol.png" alt="" />
                <span>Image Two</span>
            </div>
        </div>
        <div class="gallery-item">
            <div class="gallery-placeholder">
                <img src="images/symbol.png" alt="" />
                <span>Image Three</span>
            </div>
        </div>
        <div class="gallery-item">
            <div class="gallery-placeholder">
                <img src="images/symbol.png" alt="" />
                <span>Image Four</span>
            </div>
        </div>
    </main>

    <footer class="footer-symbol">
        <a href="index.html">
            <img src="images/symbol.png" alt="Home" width="34" height="34">
        </a>
    </footer>

    <script>
    // Soft fade-out when navigating between pages
    document.addEventListener('click', function (e) {
        var a = e.target.closest('a');
        if (!a || a.target === '_blank') return;
        var href = a.getAttribute('href') || '';
        if (href.startsWith('mailto:') || href.startsWith('#') || href.startsWith('http')) return;
        e.preventDefault();
        document.body.classList.add('page-exit');
        setTimeout(function () { window.location.href = href; }, 340);
    });
    window.addEventListener('pageshow', function (e) {
        if (e.persisted) document.body.classList.remove('page-exit');
    });
    </script>
</body>
</html>
