<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Studio Skelton</title>
    <meta name="description" content="Studio Skelton — London based hospitality &amp; residential interior design." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="image" href="images/home-bg.webp" type="image/webp">
    <link rel="preload" as="image" href="images/logo.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Lato:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Studio Skelton" />
    <meta property="og:image" content="https://oliverwild.github.io/Skelton-Web-Design/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:title" content="Studio Skelton" />
    <meta property="og:description" content="Studio Skelton — London based hospitality &amp; residential interior design." />
    <meta property="og:url" content="https://oliverwild.github.io/Skelton-Web-Design/" />
    <link rel="stylesheet" href="style.css?v=12" />
    <script>
    /* Decide before first paint whether the opening hold should play.
       It runs once per visit - navigating between pages will not replay it.
       Add ?intro to the URL to force a replay while reviewing. */
    (function () {
        if (location.search.indexOf('intro') !== -1) return;
        try {
            if (sessionStorage.getItem('skeltonIntroSeen')) {
                document.documentElement.className += ' no-intro';
            } else {
                sessionStorage.setItem('skeltonIntroSeen', '1');
            }
        } catch (e) { /* private mode: let it play */ }
    })();
    </script>
</head>

<body class="home">
    <div class="intro intro--travel" id="intro"><img src="images/symbol.png" alt="" width="40" height="40" /></div>

    <main class="center-content">
        <img class="logo-img" src="images/logo.png" alt="Studio Skelton" width="1600" height="595" />
        <p class="tagline">Hospitality &amp; residential interior design</p>
    </main>

    <nav class="main-nav">
        <a href="about.html">About</a>
        <span>|</span>
        <a href="https://www.instagram.com/studioskelton/" target="_blank" rel="noopener noreferrer">Instagram</a>
        <span>|</span>
        <a href="mailto:info@studioskelton.co">Contact</a>
    </nav>

    <footer class="footer-symbol">
        <a href="index.html">
            <img src="images/symbol.png" alt="Home" width="34" height="34">
        </a>
    </footer>

    <script>
    // Soft fade-out when navigating between pages
    document.addEventListener('click', function (e) {
        var a = e.target.closest('a');
        if (!a || a.target === '_blank') return;
        var href = a.getAttribute('href') || '';
        if (href.startsWith('mailto:') || href.startsWith('#') || href.startsWith('http')) return;
        e.preventDefault();
        document.body.classList.add('page-exit');
        setTimeout(function () { window.location.href = href; }, 340);
    });
    // Restore if page is revived from the back/forward cache
    window.addEventListener('pageshow', function (e) {
        if (e.persisted) document.body.classList.remove('page-exit');
    });
    </script>
</body>
</html>
